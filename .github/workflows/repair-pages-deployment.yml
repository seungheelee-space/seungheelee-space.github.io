name: Clear stalled Pages deployment

on:
  workflow_dispatch:

permissions:
  pages: write

jobs:
  clear-stalled-deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Cancel the stale Pages deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          deployment_url='https://api.github.com/repos/seungheelee-space/seungheelee-space.github.io/pages/deployments/f0ad9aa5fa84f36bb7e2b193290a4032df729523'
          curl --fail-with-body --silent --show-error --max-time 30 \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "${deployment_url}"
          curl --fail-with-body --silent --show-error --max-time 30 \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            --write-out '\nCancel HTTP status: %{http_code}\n' \
            "${deployment_url}/cancel"
          curl --fail-with-body --silent --show-error --max-time 30 \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "${deployment_url}"
